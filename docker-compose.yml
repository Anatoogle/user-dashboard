services:
  postgres:
    image: postgres:17
    container_name: user-dashboard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: user-dashboard-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: user-dashboard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: